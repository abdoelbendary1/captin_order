name: captin_order
description: "Captin Order - Artisanal POS & Cafe Management System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  go_router: ^17.3.0
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.1.0
  flutter_bloc: ^9.1.1
  injectable: ^3.0.0
  get_it: ^9.2.1
  fpdart: ^1.1.0
  shared_preferences: ^2.5.5
  json_annotation: ^4.12.0
  supabase_flutter: ^2.8.4
  loading_animation_widget: ^1.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  go_router_builder: ^4.4.0
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700

    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
          weight: 400

    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
